<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090a0f">
<title>CLINK — Meet Tonight</title>
<style>
:root{--bg:#090a0f;--panel:#131620;--line:#292d3a;--text:#f7f7fb;--muted:#9ba0b2;--lime:#d9ff45;--purple:#8a4dff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#21143c 0,transparent 25%),var(--bg);color:var(--text);font:15px Inter,system-ui,sans-serif}.app{max-width:1100px;margin:auto;padding:16px 16px 100px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:32px;font-weight:950;letter-spacing:-2px}.brand span{color:var(--lime)}button,input,select,textarea{font:inherit}.btn{border:1px solid var(--line);background:#171a24;color:#fff;border-radius:15px;padding:11px 14px}.primary{background:var(--lime);border-color:var(--lime);color:#11150b;font-weight:900}.panel{background:linear-gradient(150deg,#171a24,#101218);border:1px solid var(--line);border-radius:24px;padding:18px}.muted{color:var(--muted)}.auth{min-height:75vh;display:grid;place-items:center}.auth .panel{width:min(460px,100%)}label{display:block;margin:12px 0 5px;color:#bfc3cf}input,select,textarea{width:100%;background:#0f1219;color:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}.wide{width:100%;margin-top:10px}.page{display:none}.page.on{display:block}.nav{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:min(700px,calc(100% - 24px));display:flex;background:#11131beb;border:1px solid var(--line);border-radius:24px;padding:7px;backdrop-filter:blur(16px)}.nav button{flex:1;border:0;background:transparent;color:#8d92a4;padding:9px 5px;border-radius:17px}.nav button.on{background:#242033;color:#fff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#12151e;border:1px solid var(--line);border-radius:24px;overflow:hidden}.card img{width:100%;aspect-ratio:4/5;object-fit:cover;background:#222}.card .body{padding:14px}.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #242733}.ava{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#222}.grow{flex:1}.chat{display:grid;grid-template-columns:280px 1fr;gap:14px}.messages{height:430px;overflow:auto;padding:8px}.bubble{max-width:75%;background:#252936;padding:10px 12px;border-radius:16px;margin:6px 0}.bubble.me{margin-left:auto;background:var(--lime);color:#111}.composer{display:flex;gap:8px}.composer input{flex:1}.tabs{display:flex;gap:8px;margin:14px 0}.tabs button{flex:1}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.chip.on{background:var(--lime);color:#111;font-weight:900}.note{background:#1f1832;border:1px solid #3e2e62;padding:12px;border-radius:14px}.hidden{display:none!important}
@media(max-width:780px){.grid{grid-template-columns:1fr 1fr}.chat{grid-template-columns:1fr}.chat aside{display:none}}
@media(max-width:520px){.grid{grid-template-columns:1fr}.app{padding:12px 12px 92px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand">clink<span>•</span></div><button id="logout" class="btn hidden">Гарах</button></header>

<section id="auth" class="auth">
<div class="panel">
<p class="muted">21+ SOCIAL · MONGOLIA</p><h1>Өнөө орой.<br>Шинэ хүмүүс.</h1>
<div class="tabs"><button class="btn primary" data-auth="login">Нэвтрэх</button><button class="btn" data-auth="signup">Бүртгүүлэх</button></div>
<form id="loginForm"><label>Имэйл</label><input name="email" type="email" required><label>Нууц үг</label><input name="password" type="password" minlength="8" required><button class="btn primary wide">Нэвтрэх</button></form>
<form id="signupForm" class="hidden"><label>Имэйл</label><input name="email" type="email" required><label>Нууц үг</label><input name="password" type="password" minlength="8" required><label><input name="ageok" type="checkbox" required style="width:auto"> Би 21 нас хүрсэн</label><button class="btn primary wide">Бүртгэл үүсгэх</button></form>
<p id="backendNote" class="muted"></p>
</div>
</section>

<section id="main" class="hidden">
<section id="discover" class="page on"><h2>Discover</h2><div class="chips"><button class="btn chip on" data-place="">Бүгд</button><button class="btn chip" data-place="out">Гадуур</button><button class="btn chip" data-place="home">Гэртээ</button></div><div id="people" class="grid"></div></section>
<section id="friends" class="page"><h2>Friends</h2><div class="panel"><h3>Friend requests</h3><div id="requests"></div></div><div class="panel" style="margin-top:12px"><h3>Friends</h3><div id="friendList"></div></div></section>
<section id="chat" class="page"><h2>Chat</h2><div class="chat"><aside class="panel" id="conversations"></aside><div class="panel"><b id="chatTitle">Найзаа сонгоно уу</b><div id="messages" class="messages"></div><form id="messageForm" class="composer"><input id="messageInput" maxlength="1000" disabled placeholder="Зурвас..."><button id="sendBtn" class="btn primary" disabled>➤</button></form></div></div></section>
<section id="tonight" class="page"><h2>Tonight</h2><form id="statusForm" class="panel"><div class="note">Статус 6 цагийн дараа дуусна. Гэрийн яг хаяг нийтлэхгүй.</div><label>Аймаг / хот</label><input id="province" value="Улаанбаатар" required><label>Дүүрэг / сум</label><input id="district" required><label>Хаана?</label><select id="place"><option value="out">Гадуур</option><option value="home">Гэртээ</option></select><label>Газрын нэр</label><input id="venue"><label>Хэдүүлээ?</label><input id="groupCount" type="number" min="1" max="30" value="2"><label>Тайлбар</label><textarea id="statusBio" maxlength="180"></textarea><button class="btn primary wide">Статус нийтлэх</button><button type="button" id="stopStatus" class="btn wide">Статус унтраах</button></form></section>
<section id="profile" class="page"><h2>Profile</h2><div class="panel"><img id="avatarPreview" class="ava" style="width:140px;height:140px;border-radius:28px"><label>Зураг upload</label><input id="photo" type="file" accept="image/jpeg,image/png,image/webp"></div><form id="profileForm" class="panel" style="margin-top:12px"><label>Нэр</label><input id="name" required><label>Төрсөн огноо</label><input id="birth" type="date" required><label>Аймаг / хот</label><input id="profileProvince" value="Улаанбаатар" required><label>Дүүрэг / сум</label><input id="profileDistrict" required><label>Bio</label><textarea id="bio" maxlength="250"></textarea><button class="btn primary wide">Хадгалах</button></form></section>
</section>
</div>

<nav id="nav" class="nav hidden"><button class="on" data-view="discover">⌖<br>Discover</button><button data-view="friends">☺<br>Friends</button><button data-view="chat">💬<br>Chat</button><button data-view="tonight">◉<br>Tonight</button><button data-view="profile">○<br>Profile</button></nav>
<div id="toast"></div>
<script src="./config.js"></script><script type="module" src="./app.js"></script>
</body></html>
